baseURL = 'https://zhihuya188.github.io/'
title = '我的 Hugo 站点'
theme = 'hextra'

# 中文站点
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true

# Markdown 渲染
[markup]
    # 允许裸 HTML
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    # Hextra 语法高亮
    [markup.highlight]
        noClasses = false

# 顶部导航
[menu]
    [[menu.main]]
        name = '文章'
        pageRef = '/blog'
        weight = 1

    [[menu.main]]
        name = '关于'
        pageRef = '/about'
        weight = 2

    [[menu.main]]
        name = '搜索'
        weight = 3
        [menu.main.params]
            type = 'search'

    [[menu.main]]
        name = 'GitHub'
        url = 'https://github.com/zhihuya188'
        weight = 4
        [menu.main.params]
            icon = 'github'

[params]
    # 导航栏显示站点名
    [params.navbar]
        displayTitle = true
        displayLogo = false

    # 页脚
    [params.footer]
        displayCopyright = false
        displayPoweredBy = true

    # 关闭"编辑此页"链接
    [params.editURL]
        enable = false
