baseURL = 'https://zhihuya188.github.io/'
title = '我的 Hugo 站点'
theme = 'hextra'

# 中文站点
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true

# 用 Git 提交时间作为文章"最后修改"来源
enableGitInfo = true

# Markdown 渲染
[markup]
    # 允许裸 HTML
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    # Hextra 语法高亮
    [markup.highlight]
        noClasses = false

# 输出格式（home 额外输出 llms.txt，供 AI 工具引用）
[outputs]
    home = ['html', 'llms']
    page = ['html']
    section = ['html', 'rss']

# 顶部导航
[menu]
    [[menu.main]]
        name = '文章'
        pageRef = '/blog'
        weight = 1

    [[menu.main]]
        name = '归档'
        pageRef = '/archives'
        weight = 2

    [[menu.main]]
        name = '标签'
        pageRef = '/tags'
        weight = 3

    [[menu.main]]
        name = '关于'
        pageRef = '/about'
        weight = 4

    [[menu.main]]
        name = '搜索'
        weight = 5
        [menu.main.params]
            type = 'search'

    [[menu.main]]
        name = 'GitHub'
        url = 'https://github.com/zhihuya188'
        weight = 6
        [menu.main.params]
            icon = 'github'

[params]
    # 站点描述（用于首页 SEO meta description）
    description = '洋洋的个人博客：记录技术笔记、AI 资讯与生活随笔。'

    # 文章页显示最后修改日期与作者（依赖 enableGitInfo）——注意：必须是 [params] 顶层键
    displayUpdatedDate = true
    displayUpdatedAuthor = true
    dateFormat = '2006-01-02'

    # 外部链接加箭头装饰
    externalLinkDecoration = true

    # 导航栏显示站点名
    [params.navbar]
        displayTitle = true
        displayLogo = false

    # 页脚（版权文本见 i18n/zh-cn.yaml）
    [params.footer]
        displayCopyright = true
        displayPoweredBy = true

    # 关闭"编辑此页"链接
    [params.editURL]
        enable = false

    # 主题模式：跟随系统，允许手动切换
    [params.theme]
        default = 'system'
        displayToggle = true

    # 博客列表与文章页显示标签
    [params.blog]
        [params.blog.list]
            displayTags = true

    [params.toc]
        displayTags = true
